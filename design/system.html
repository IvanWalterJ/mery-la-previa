<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mery La Previa — Design System Board</title>
  <style>
    :root {
      --q-bg: #0a0b0a;
      --q-surface: #111210;
      --q-card: rgba(24, 24, 24, 0.55);
      --q-cream: #efe7d2;
      --q-cream-muted: rgba(245, 242, 234, 0.7);
      --q-gold: #cfbe91;
      --q-border: rgba(239, 231, 210, 0.15);
      --q-border-strong: rgba(239, 231, 210, 0.28);
      --font-display: Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1440px;
      min-height: 900px;
      background: var(--q-bg);
      color: var(--q-cream);
      font-family: var(--font-sans);
      padding: 60px 80px;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 2.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--q-cream);
      margin-bottom: 8px;
    }
    .subtitle {
      color: var(--q-gold);
      font-size: 0.95rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 48px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      margin-bottom: 48px;
    }
    .swatch {
      background: var(--q-surface);
      border: 1px solid var(--q-border);
      border-radius: 12px;
      padding: 18px;
    }
    .swatch-color {
      height: 70px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .swatch-name {
      font-size: 0.82rem;
      color: var(--q-cream-muted);
      font-family: monospace;
    }
    .swatch-val {
      font-size: 1rem;
      color: var(--q-cream);
      font-weight: 600;
      margin-top: 4px;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--q-gold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--q-border);
      padding-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>Mery La Previa</h1>
  <div class="subtitle">Design System &amp; Brand Tokens</div>

  <div class="section-title">Color Palette</div>
  <div class="grid">
    <div class="swatch">
      <div class="swatch-color" style="background: #0a0b0a;"></div>
      <div class="swatch-name">--q-bg</div>
      <div class="swatch-val">#0a0b0a</div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background: #111210;"></div>
      <div class="swatch-name">--q-surface</div>
      <div class="swatch-val">#111210</div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background: #cfbe91;"></div>
      <div class="swatch-name">--q-gold</div>
      <div class="swatch-val">#cfbe91</div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background: #efe7d2;"></div>
      <div class="swatch-name">--q-cream</div>
      <div class="swatch-val">#efe7d2</div>
    </div>
  </div>
</body>
</html>
